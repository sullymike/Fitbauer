name: Sincronizar wiki

# El wiki se genera desde docs/ con scripts/build_wiki.py, nunca a mano: así no
# puede divergir del código. Este workflow lo regenera cuando cambia la
# documentación en main.
#
# Requiere un secreto WIKI_TOKEN: GITHUB_TOKEN no tiene permiso de escritura
# sobre el repositorio del wiki (es un repo aparte). Crea un Personal Access
# Token con permiso `repo` y guárdalo en Settings ▸ Secrets ▸ Actions.
# Sin ese secreto el job se salta sin fallar, y el wiki se puede regenerar a
# mano siguiendo las instrucciones de scripts/build_wiki.py.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'INSTALL.md'
      - 'INSTALL_EN.md'
      - 'BHF_DISTRIBUTION.md'
      - 'BHF_DISTRIBUTION_EN.md'
      - 'core/constants.py'
      - 'mossbauer_fit_cli.py'
      - 'fit_bhf_distribution_cli.py'
      - 'scripts/build_wiki.py'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # El contexto `secrets` no se puede usar en un `if:` (ni de job ni de paso):
      # Actions lo rechaza con "Unrecognized named-value: 'secrets'". Se comprueba
      # aquí, pasándolo por env, y los pasos siguientes cuelgan de este resultado.
      - name: Comprobar el secreto
        id: token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -n "$WIKI_TOKEN" ]; then
            echo "presente=si" >> "$GITHUB_OUTPUT"
          else
            echo "presente=no" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin WIKI_TOKEN: el wiki no se sincroniza. Regenéralo a mano con scripts/build_wiki.py."
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.presente == 'si'

      - uses: actions/setup-python@v5
        if: steps.token.outputs.presente == 'si'
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        if: steps.token.outputs.presente == 'si'
        run: pip install -r requirements.txt

      - name: Clonar el wiki
        if: steps.token.outputs.presente == 'si'
        run: |
          git clone https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

      - name: Generar páginas
        if: steps.token.outputs.presente == 'si'
        run: python scripts/build_wiki.py --out wiki

      - name: Publicar
        if: steps.token.outputs.presente == 'si'
        working-directory: wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "El wiki ya está al día."
          else
            git commit -m "docs(wiki): regenerado desde ${GITHUB_SHA:0:7}"
            git push
          fi
